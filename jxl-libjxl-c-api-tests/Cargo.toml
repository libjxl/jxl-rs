[package]
name = "jxl-libjxl-c-api-tests"
description = "C/C++ decoding harness and equivalency tests for jxl-libjxl-c-api"
version = "0.8.0"
publish = false
authors = ["Luca Versari <veluca93@gmail.com>"]
repository = "https://github.com/libjxl/jxl-rs"
edition = "2024"
license = "BSD-3-Clause"
rust-version.workspace = true

[dependencies]
jxl = { path = "../jxl", version = "=0.8.0", default-features = false }
jxl-libjxl-c-api = { path = "../jxl-libjxl-c-api", version = "=0.8.0", default-features = false }

[build-dependencies]
cc = "1"

[features]
default = ["all-simd", "brotli"]

brotli = ["jxl/brotli", "jxl-libjxl-c-api/brotli"]

all-simd = ["jxl/all-simd", "jxl-libjxl-c-api/all-simd"]
sse42 = ["jxl/sse42", "jxl-libjxl-c-api/sse42"]
avx = ["jxl/avx", "jxl-libjxl-c-api/avx"]
avx512 = ["jxl/avx512", "jxl-libjxl-c-api/avx512"]
neon = ["jxl/neon", "jxl-libjxl-c-api/neon"]
simd128 = ["jxl/simd128", "jxl-libjxl-c-api/simd128"]

[lints]
workspace = true
