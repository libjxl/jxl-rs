[package]
name = "jxl-libjxl-c-api"
description = "libjxl C-ABI compatibility layer for jxl-rs"
version = "0.8.0"
readme = "../README.md"
keywords = ["jpeg-xl", "decoder", "ffi", "libjxl"]
categories = ["multimedia::images", "api-bindings"]
authors = ["Luca Versari <veluca93@gmail.com>"]
repository = "https://github.com/libjxl/jxl-rs"
edition = "2024"
license = "BSD-3-Clause"
links = "jxl"
rust-version.workspace = true

[lib]
name = "jxl_libjxl_c_api"
crate-type = ["cdylib", "staticlib", "rlib"]

[package.metadata.capi.header]
generation = false

[package.metadata.capi.install.include]
asset = [{ from = "include/jxl/*.h", to = "jxl" }]

[package.metadata.capi.library]
name = "jxl"

[package.metadata.capi.pkg_config]
name = "libjxl"
filename = "libjxl"

[dependencies]
jxl = { path = "../jxl", version = "=0.8.0", default-features = false }
rayon = "1.12.0"

[features]
default = ["all-simd", "brotli"]

brotli = ["jxl/brotli"]

all-simd = ["jxl/all-simd"]
sse42 = ["jxl/sse42"]
avx = ["jxl/avx"]
avx512 = ["jxl/avx512"]
neon = ["jxl/neon"]
simd128 = ["jxl/simd128"]

[lints]
workspace = true
