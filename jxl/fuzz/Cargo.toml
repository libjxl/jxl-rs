[package]
name = "jxl-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.jxl]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[lib]
path = "src/lib.rs"

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false

[[bin]]
name = "decode_parallel"
path = "fuzz_targets/decode_parallel.rs"
test = false
doc = false

[[bin]]
name = "decode_header"
path = "fuzz_targets/decode_header.rs"
test = false
doc = false

[[bin]]
name = "decode_progressive"
path = "fuzz_targets/decode_progressive.rs"
test = false
doc = false

[[bin]]
name = "decode_progressive_parallel"
path = "fuzz_targets/decode_progressive_parallel.rs"
test = false
doc = false

[[bin]]
name = "decode_diff"
path = "fuzz_targets/decode_diff.rs"
test = false
doc = false

[profile.release]
debug = 1
